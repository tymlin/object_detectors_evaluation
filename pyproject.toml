[project]
name = "object-detectors-evaluation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tymoteusz Lindner", email = "tymoteusz.lindner@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "distinctipy>=1.3.4",
    "faster-coco-eval>=1.7.2",
    "fiftyone>=1.16.0",
    "huggingface-hub>=1.18.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "natsort>=8.4.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pycocotools>=2.0.11",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
    "torch>=2.12.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.27.0",
    "transformers>=5.10.2",
    "ultralytics>=8.4.60",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
]
