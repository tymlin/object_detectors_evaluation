run_name_postfix: null

dataset:
    name: coco
    auto_download: false
    config:
        dataset_dirpath: datasets/fiftyone/coco-2017
        split: validation
        classes_of_interest: null
        include_crowd: true
        drop_images_with_crowd: false
        remove_empty_images: false

evaluation:
    batch_size: 1
    num_samples: null
    warmup_iterations: 10
    window_map_sample_count: 100
    metrics:
        backend: pycocotools
        extended_summary: false
        class_metrics: true

outputs:
    save_predictions: true
    save_plots: true
    num_plot_samples: 10
    plot_score_threshold: 0.25

defaults:
    model: &model_defaults
        engine_name: null
        auto_download: true
        config:
            device: auto
            dtype: float32
            score_threshold: 0.001
            max_detections: null

models:
    - name: dfine-nano-coco
      <<: *model_defaults
    - name: dfine-small-coco
      <<: *model_defaults
